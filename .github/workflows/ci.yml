name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: buddybills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check code formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Build and type check
        run: bun run build

      - name: Run Unit & Server Action Tests
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/buddybills_test"
          IS_TEST_DB: "true"
          BETTER_AUTH_SECRET: "test-secret"
          BETTER_AUTH_URL: "http://localhost:3000"
        run: |
          bunx drizzle-kit push
          bun test src

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E Tests
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/buddybills_test"
          IS_TEST_DB: "true"
          BETTER_AUTH_SECRET: "test-secret"
          BETTER_AUTH_URL: "http://localhost:3000"
        run: bunx playwright test
